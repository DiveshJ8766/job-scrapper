name: Daily job refresh

on:
  schedule:
    # 01:17 UTC = 06:47 IST, every day (off the hour to avoid GitHub's busiest cron slots)
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      trigger:
        description: "Why this run was started (manual or schedule)"
        required: false
        default: manual
      only:
        description: "Optional: only run sources whose name starts with this (e.g. greenhouse)"
        required: false
        default: ""

# Never let two refreshes write at the same time.
concurrency:
  group: job-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'gemini' }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      LLM_MAX_RPM: ${{ vars.LLM_MAX_RPM || '12' }}
      LLM_MAX_JOBS_PER_RUN: ${{ vars.LLM_MAX_JOBS_PER_RUN || '900' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check required secrets
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::DATABASE_URL secret is not set"; exit 1; fi
          if [ -z "$ADZUNA_APP_ID" ]; then echo "::warning::ADZUNA_APP_ID not set - Adzuna will be skipped"; fi
          if [ -z "$GEMINI_API_KEY" ] && [ -z "$OPENAI_API_KEY" ]; then echo "::warning::No LLM key set - classification will be skipped"; fi
      - name: Run pipeline
        env:
          # Inputs pass through env (never interpolated into the script) to avoid injection.
          RUN_TRIGGER: ${{ github.event_name == 'schedule' && 'schedule' || inputs.trigger || 'manual' }}
          RUN_ONLY: ${{ inputs.only }}
        run: |
          set -o pipefail
          case "$RUN_TRIGGER" in schedule|manual) ;; *) RUN_TRIGGER=manual ;; esac
          if [ -n "$RUN_ONLY" ]; then
            python -m pipeline.run --trigger "$RUN_TRIGGER" --only "$RUN_ONLY" | tee run-summary.json
          else
            python -m pipeline.run --trigger "$RUN_TRIGGER" | tee run-summary.json
          fi
      - name: Job summary
        if: always()
        run: |
          echo '### Pipeline run' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          tail -n 20 run-summary.json >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "no summary" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
